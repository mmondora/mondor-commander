<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mondor Commander</title>
<style>
/* ═══════════════ DOS AESTHETICS ═══════════════ */
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #000080;
  --bg-dark: #000060;
  --bg-panel: #000080;
  --text: #00FFFF;
  --text-dim: #008888;
  --header: #FFFF00;
  --selected-bg: #00AAAA;
  --selected-text: #000000;
  --green: #00FF00;
  --red: #FF5555;
  --yellow: #FFFF00;
  --blue: #5555FF;
  --white: #FFFFFF;
  --gray: #AAAAAA;
  --border: #00AAAA;
  --fkey-bg: #000000;
  --fkey-text: #00FFFF;
  --fkey-label: #FFFFFF;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.3;
  overflow: hidden;
  cursor: default;
  user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* ═══════════════ HEADER BAR ═══════════════ */
#header {
  background: var(--bg);
  color: var(--header);
  text-align: center;
  padding: 2px 0;
  font-weight: bold;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

/* ═══════════════ MAIN CONTENT ═══════════════ */
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* ═══════════════ PANELS (Browser View) ═══════════════ */
.panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-panel);
  overflow: hidden;
  position: relative;
}

.panel.focused { }
.panel.focused .panel-header { background: var(--selected-bg); color: var(--selected-text); }

.panel-border {
  width: 1px;
  background: var(--border);
  flex-shrink: 0;
}

.panel-header {
  background: var(--bg);
  color: var(--header);
  padding: 2px 8px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  text-align: center;
}

.panel-column-headers {
  display: flex;
  background: var(--bg);
  color: var(--text-dim);
  padding: 1px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  font-size: 12px;
}

.panel-column-headers span:first-child { flex: 1; }
.panel-column-headers span:last-child { width: 80px; text-align: right; }

.file-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

.file-entry {
  display: flex;
  padding: 0 8px;
  cursor: pointer;
  white-space: nowrap;
  height: 20px;
  align-items: center;
}

.file-entry:hover { background: rgba(0,170,170,0.15); }
.file-entry.selected { background: var(--selected-bg); color: var(--selected-text); }
.file-entry.selected .file-name,
.file-entry.selected .file-size { color: var(--selected-text); }

.file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.file-size { width: 80px; text-align: right; color: var(--text-dim); }

/* File status colors */
.file-entry.status-identical .file-name { color: var(--green); }
.file-entry.status-only-here .file-name { color: var(--red); }
.file-entry.status-modified .file-name { color: var(--yellow); }
.file-entry.status-directory .file-name { color: var(--white); }
.file-entry.status-normal .file-name { color: var(--white); }

.file-entry.selected.status-identical .file-name,
.file-entry.selected.status-only-here .file-name,
.file-entry.selected.status-modified .file-name,
.file-entry.selected.status-directory .file-name,
.file-entry.selected.status-normal .file-name { color: var(--selected-text); }

.dir-indicator { color: var(--blue); margin-left: 4px; }

/* ═══════════════ STATUS BAR ═══════════════ */
#statusbar {
  background: var(--bg);
  color: var(--text);
  padding: 2px 12px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
}

/* ═══════════════ F-KEY BAR ═══════════════ */
#fkeybar {
  display: flex;
  background: var(--fkey-bg);
  flex-shrink: 0;
  border-top: 1px solid var(--border);
}

.fkey {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px 0;
  cursor: pointer;
  border-right: 1px solid #333;
}
.fkey:hover { background: #333; }
.fkey-num { color: var(--fkey-text); margin-right: 2px; font-size: 12px; }
.fkey-label { color: var(--fkey-label); font-size: 12px; }
.fkey.active { background: var(--selected-bg); }
.fkey.active .fkey-num, .fkey.active .fkey-label { color: var(--selected-text); }
.fkey.disabled { opacity: 0.4; cursor: default; }

/* ═══════════════ PROGRESS OVERLAY ═══════════════ */
#progress-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.progress-box {
  border: 1px solid var(--border);
  padding: 20px 40px;
  background: var(--bg);
  text-align: center;
  min-width: 400px;
}

.progress-title { color: var(--header); font-weight: bold; margin-bottom: 12px; font-size: 14px; }
.progress-text { color: var(--text); margin-bottom: 8px; }

.progress-bar-container {
  width: 100%;
  height: 16px;
  border: 1px solid var(--border);
  margin: 8px 0;
}

.progress-bar-fill {
  height: 100%;
  background: var(--selected-bg);
  transition: width 0.2s;
}

/* ═══════════════ COMPARE VIEW ═══════════════ */
#compare-view {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.compare-stats {
  display: flex;
  gap: 16px;
  padding: 8px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  justify-content: center;
  flex-wrap: wrap;
}

.compare-stat {
  padding: 2px 8px;
}

.compare-stat .stat-value { font-weight: bold; }

.compare-columns {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.compare-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.compare-column-header {
  text-align: center;
  padding: 4px;
  font-weight: bold;
  border-bottom: 1px solid var(--border);
}

.compare-column-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px;
}

.compare-item {
  padding: 1px 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  height: 20px;
  line-height: 20px;
}
.compare-item:hover { background: rgba(0,170,170,0.15); }

/* ═══════════════ SPACE VIEW ═══════════════ */
#space-view {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.space-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.space-treemap-area {
  flex: 2;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.space-treemap-header {
  padding: 4px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  color: var(--header);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

.space-breadcrumb { cursor: pointer; }
.space-breadcrumb:hover { text-decoration: underline; }

.treemap-canvas {
  flex: 1;
  display: block;
}

.treemap-tooltip {
  position: absolute;
  background: #000;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 4px 8px;
  font-size: 12px;
  pointer-events: none;
  z-index: 50;
  display: none;
  white-space: nowrap;
}

.space-sidebar {
  flex: 1;
  overflow-y: auto;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.space-section {
  padding: 8px;
  border-bottom: 1px solid var(--border);
}

.space-section-title {
  color: var(--header);
  font-weight: bold;
  margin-bottom: 4px;
}

.space-ext-item, .space-file-item {
  display: flex;
  justify-content: space-between;
  padding: 1px 4px;
  font-size: 12px;
}

.space-ext-bar {
  height: 8px;
  background: var(--border);
  margin-top: 1px;
}

/* ═══════════════ DUPLICATES VIEW ═══════════════ */
#dupes-view {
  display: none;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
}

.dupes-summary {
  padding: 8px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.dupes-sort-bar {
  padding: 4px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  font-size: 12px;
}

.dupes-sort-btn { cursor: pointer; color: var(--text-dim); }
.dupes-sort-btn:hover, .dupes-sort-btn.active { color: var(--header); }

.dupes-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
}

.dupe-group {
  border: 1px solid var(--border);
  margin-bottom: 4px;
  padding: 4px 8px;
}

.dupe-group-header {
  display: flex;
  justify-content: space-between;
  color: var(--header);
  font-weight: bold;
  margin-bottom: 2px;
  font-size: 12px;
}

.dupe-file {
  padding: 1px 12px;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dupe-file.side-left { color: var(--text); }
.dupe-file.side-right { color: var(--green); }

/* ═══════════════ FILE VIEWER MODAL ═══════════════ */
#file-viewer {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  flex-direction: column;
}

.viewer-header {
  background: var(--bg);
  color: var(--header);
  padding: 4px 12px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.viewer-close { cursor: pointer; color: var(--red); }
.viewer-close:hover { color: #FF8888; }

.viewer-content {
  flex: 1;
  overflow: auto;
  padding: 8px 12px;
  background: var(--bg-dark);
}

.viewer-content pre {
  color: var(--text);
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  font-size: 12px;
  white-space: pre;
  tab-size: 4;
}

.viewer-meta {
  color: var(--text-dim);
  font-size: 12px;
  padding: 4px 12px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}

/* Diff view inside viewer */
.diff-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.diff-pane {
  flex: 1;
  overflow: auto;
  padding: 4px;
}

.diff-pane-header {
  text-align: center;
  padding: 2px;
  font-weight: bold;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.diff-line {
  font-size: 12px;
  white-space: pre;
  min-height: 18px;
  line-height: 18px;
  padding: 0 4px;
}

.diff-line.added { background: rgba(0,255,0,0.15); color: var(--green); }
.diff-line.removed { background: rgba(255,0,0,0.15); color: var(--red); }
.diff-line.unchanged { color: var(--text-dim); }

.diff-line-num {
  display: inline-block;
  width: 40px;
  text-align: right;
  margin-right: 8px;
  color: var(--text-dim);
  font-size: 11px;
}

.diff-separator {
  width: 1px;
  background: var(--border);
  flex-shrink: 0;
}

/* ═══════════════ SEARCH BAR ═══════════════ */
#search-bar {
  display: none;
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 4px 8px;
  z-index: 150;
  display: none;
  align-items: center;
}

#search-bar.visible { display: flex; }

#search-input {
  background: var(--fkey-bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 2px 8px;
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  font-size: 13px;
  outline: none;
  width: 300px;
}

#search-label { color: var(--header); margin-right: 8px; }

/* ═══════════════ QUIT DIALOG ═══════════════ */
#quit-dialog {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg);
  border: 2px solid var(--border);
  padding: 20px 30px;
  z-index: 300;
  text-align: center;
}

#quit-dialog .quit-title { color: var(--header); font-weight: bold; margin-bottom: 12px; }
#quit-dialog .quit-buttons { display: flex; gap: 16px; justify-content: center; }
#quit-dialog .quit-btn {
  padding: 4px 16px;
  background: var(--fkey-bg);
  color: var(--text);
  border: 1px solid var(--border);
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
}
#quit-dialog .quit-btn:hover { background: var(--selected-bg); color: var(--selected-text); }

/* ═══════════════ SINGLE MODE ═══════════════ */
.single-mode .panel { max-width: 800px; margin: 0 auto; }

/* ═══════════════ SCROLLBAR ═══════════════ */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); }
::-webkit-scrollbar-thumb:hover { background: var(--text); }
</style>
</head>
<body>
<div id="app">
  <div id="header">┤ Mondor Commander ├</div>
  <div id="main">
    <!-- Progress overlay -->
    <div id="progress-overlay">
      <div class="progress-box">
        <div class="progress-title">┤ Scanning ├</div>
        <div class="progress-text" id="progress-left">Left: scanning...</div>
        <div class="progress-text" id="progress-right" style="display:none">Right: scanning...</div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
        <div class="progress-text" id="progress-status">Initializing...</div>
      </div>
    </div>

    <!-- Browser View (default) -->
    <div id="browser-view" style="display:none; flex:1; flex-direction:row; overflow:hidden;">
      <div class="panel" id="panel-left">
        <div class="panel-header" id="panel-left-header">Loading...</div>
        <div class="panel-column-headers"><span>Name</span><span>Size</span></div>
        <div class="file-list" id="file-list-left"></div>
      </div>
      <div class="panel-border" id="panel-divider"></div>
      <div class="panel" id="panel-right">
        <div class="panel-header" id="panel-right-header">Loading...</div>
        <div class="panel-column-headers"><span>Name</span><span>Size</span></div>
        <div class="file-list" id="file-list-right"></div>
      </div>
    </div>

    <!-- Compare View -->
    <div id="compare-view">
      <div class="compare-stats" id="compare-stats"></div>
      <div class="compare-columns" id="compare-columns"></div>
    </div>

    <!-- Space View -->
    <div id="space-view">
      <div class="space-container">
        <div class="space-treemap-area">
          <div class="space-treemap-header">
            <span id="treemap-breadcrumb"></span>
            <span id="treemap-info"></span>
          </div>
          <canvas class="treemap-canvas" id="treemap-canvas"></canvas>
          <div class="treemap-tooltip" id="treemap-tooltip"></div>
        </div>
        <div class="space-sidebar" id="space-sidebar"></div>
      </div>
    </div>

    <!-- Duplicates View -->
    <div id="dupes-view">
      <div class="dupes-summary" id="dupes-summary"></div>
      <div class="dupes-sort-bar" id="dupes-sort-bar"></div>
      <div class="dupes-list" id="dupes-list"></div>
    </div>

    <!-- File Viewer Modal -->
    <div id="file-viewer">
      <div class="viewer-header">
        <span id="viewer-title">File Viewer</span>
        <span class="viewer-close" id="viewer-close">[ ESC to close ]</span>
      </div>
      <div class="viewer-content" id="viewer-content"></div>
      <div class="viewer-meta" id="viewer-meta"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-left">Left: scanning...</span>
    <span id="status-right"></span>
    <span id="status-scan">Scan: ...</span>
  </div>

  <div id="fkeybar">
    <div class="fkey" data-key="F1"><span class="fkey-num">1</span><span class="fkey-label">Browse</span></div>
    <div class="fkey" data-key="F3"><span class="fkey-num">3</span><span class="fkey-label">View</span></div>
    <div class="fkey" data-key="F5"><span class="fkey-num">5</span><span class="fkey-label">Compare</span></div>
    <div class="fkey" data-key="F6"><span class="fkey-num">6</span><span class="fkey-label">Space</span></div>
    <div class="fkey" data-key="F7"><span class="fkey-num">7</span><span class="fkey-label">Dupes</span></div>
    <div class="fkey" data-key="F10"><span class="fkey-num">10</span><span class="fkey-label">Quit</span></div>
  </div>
</div>

<!-- Search bar -->
<div id="search-bar">
  <span id="search-label">Search:</span>
  <input type="text" id="search-input" autocomplete="off">
</div>

<!-- Quit dialog -->
<div id="quit-dialog">
  <div class="quit-title">┤ Quit Mondor Commander? ├</div>
  <div class="quit-buttons">
    <button class="quit-btn" id="quit-yes">Yes (Y)</button>
    <button class="quit-btn" id="quit-no">No (N)</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   MONDOR COMMANDER — Frontend Logic
   ═══════════════════════════════════════════════════════════════ */

(function() {
'use strict';

// ─── State ───
const state = {
  status: 'scanning',
  dualMode: false,
  currentView: 'browser', // browser | compare | space | dupes
  focusedPanel: 'left',   // left | right
  leftPath: '',
  rightPath: '',
  leftEntries: [],
  rightEntries: [],
  leftSelectedIndex: 0,
  rightSelectedIndex: 0,
  config: {},
  comparison: null,
  spaceLeft: null,
  spaceRight: null,
  duplicates: null,
  scanLeft: null,
  scanRight: null,
  viewerOpen: false,
  searchOpen: false,
  searchQuery: '',
  treemapDrillPath: null,
  treemapRects: [],
  dupeSortBy: 'size', // size | count
};

// ─── DOM refs ───
const $ = id => document.getElementById(id);
const overlay = $('progress-overlay');
const browserView = $('browser-view');
const compareView = $('compare-view');
const spaceView = $('space-view');
const dupesView = $('dupes-view');
const fileViewer = $('file-viewer');
const searchBar = $('search-bar');
const searchInput = $('search-input');
const quitDialog = $('quit-dialog');

// ─── WebSocket ───
let ws = null;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleWSMessage(msg);
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}

function handleWSMessage(msg) {
  switch(msg.type) {
    case 'scan:progress':
      const el = msg.side === 'left' ? $('progress-left') : $('progress-right');
      el.textContent = `${msg.side === 'left' ? 'Left' : 'Right'}: ${msg.scanned.toLocaleString()} files scanned`;
      $('progress-status').textContent = `Scanning ${msg.side}...`;
      break;
    case 'scan:complete':
      $('progress-status').textContent = `${msg.side} scan complete (${(msg.duration/1000).toFixed(1)}s)`;
      break;
    case 'analysis:complete':
      $('progress-status').textContent = 'Ready!';
      $('progress-bar').style.width = '100%';
      setTimeout(initApp, 300);
      break;
    case 'error':
      $('progress-status').textContent = `Error: ${msg.message}`;
      break;
  }
}

// ─── Init ───
async function checkStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    state.dualMode = data.dualMode;
    state.config = data;
    $('progress-right').style.display = data.dualMode ? 'block' : 'none';
    if (data.status === 'ready') {
      initApp();
    } else {
      $('progress-bar').style.width = '50%';
      setTimeout(checkStatus, 500);
    }
  } catch(e) {
    setTimeout(checkStatus, 1000);
  }
}

async function initApp() {
  overlay.style.display = 'none';

  // Fetch initial data
  const [statusRes] = await Promise.all([fetch('/api/status')]);
  const status = await statusRes.json();
  state.dualMode = status.dualMode;
  state.status = 'ready';

  // Fetch scan summaries
  const leftRes = await fetch('/api/scan/left');
  state.scanLeft = await leftRes.json();

  if (state.dualMode) {
    const rightRes = await fetch('/api/scan/right');
    state.scanRight = await rightRes.json();
  }

  // Setup panels
  if (!state.dualMode) {
    $('panel-right').style.display = 'none';
    $('panel-divider').style.display = 'none';
    document.querySelector('#browser-view').classList.add('single-mode');
    // Disable compare F-key
    document.querySelector('[data-key="F5"]').classList.add('disabled');
  }

  updateStatusBar();
  showView('browser');
  await loadBrowseData('left', '');
  if (state.dualMode) {
    await loadBrowseData('right', '');
  }
  setFocusedPanel('left');
}

// ─── Views ───
function showView(view) {
  state.currentView = view;
  browserView.style.display = 'none';
  compareView.style.display = 'none';
  spaceView.style.display = 'none';
  dupesView.style.display = 'none';

  // Update fkey active states
  document.querySelectorAll('.fkey').forEach(el => el.classList.remove('active'));

  switch(view) {
    case 'browser':
      browserView.style.display = 'flex';
      document.querySelector('[data-key="F1"]').classList.add('active');
      break;
    case 'compare':
      if (!state.dualMode) return;
      compareView.style.display = 'flex';
      document.querySelector('[data-key="F5"]').classList.add('active');
      loadCompareView();
      break;
    case 'space':
      spaceView.style.display = 'flex';
      document.querySelector('[data-key="F6"]').classList.add('active');
      loadSpaceView();
      break;
    case 'dupes':
      dupesView.style.display = 'flex';
      document.querySelector('[data-key="F7"]').classList.add('active');
      loadDupesView();
      break;
  }
}

// ─── Browser View ───
async function loadBrowseData(side, browsePath) {
  try {
    const params = new URLSearchParams({ side, path: browsePath });
    const res = await fetch(`/api/browse?${params}`);
    const data = await res.json();

    if (side === 'left') {
      state.leftPath = browsePath;
      state.leftEntries = data.entries;
      state.leftSelectedIndex = 0;
      $('panel-left-header').textContent = `┤ ${state.config.path1}${browsePath ? '/' + browsePath : ''} ├`;
      renderFileList('left');
    } else {
      state.rightPath = browsePath;
      state.rightEntries = data.entries;
      state.rightSelectedIndex = 0;
      $('panel-right-header').textContent = `┤ ${state.config.path2}${browsePath ? '/' + browsePath : ''} ├`;
      renderFileList('right');
    }
  } catch(e) {
    console.error('Browse error:', e);
  }
}

function renderFileList(side) {
  const list = side === 'left' ? $('file-list-left') : $('file-list-right');
  const entries = side === 'left' ? state.leftEntries : state.rightEntries;
  const selectedIndex = side === 'left' ? state.leftSelectedIndex : state.rightSelectedIndex;
  const currentPath = side === 'left' ? state.leftPath : state.rightPath;

  // Filter by search if active
  let filtered = entries;
  if (state.searchOpen && state.searchQuery && state.focusedPanel === side) {
    const q = state.searchQuery.toLowerCase();
    filtered = entries.filter(e => e.name.toLowerCase().includes(q));
  }

  let html = '';

  // Parent directory entry
  if (currentPath) {
    const cls = selectedIndex === 0 ? ' selected' : '';
    html += `<div class="file-entry status-directory${cls}" data-action="parent" data-side="${side}">
      <span class="file-name">..</span><span class="file-size">&lt;DIR&gt;</span></div>`;
  }

  const offset = currentPath ? 1 : 0;
  for (let i = 0; i < filtered.length; i++) {
    const entry = filtered[i];
    const idx = i + offset;
    const cls = idx === selectedIndex ? ' selected' : '';
    const statusCls = entry.isDirectory ? 'status-directory' : `status-${entry.status || 'normal'}`;

    if (entry.isDirectory) {
      html += `<div class="file-entry ${statusCls}${cls}" data-index="${idx}" data-side="${side}" data-path="${esc(entry.path)}" data-dir="true">
        <span class="file-name">${esc(entry.name)}/</span><span class="file-size">${entry.sizeHuman || '&lt;DIR&gt;'}</span></div>`;
    } else {
      html += `<div class="file-entry ${statusCls}${cls}" data-index="${idx}" data-side="${side}" data-path="${esc(entry.path)}" data-dir="false">
        <span class="file-name">${esc(entry.name)}</span><span class="file-size">${entry.sizeHuman || ''}</span></div>`;
    }
  }

  list.innerHTML = html;

  // Scroll selected into view
  const sel = list.querySelector('.selected');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

function setFocusedPanel(side) {
  state.focusedPanel = side;
  $('panel-left').classList.toggle('focused', side === 'left');
  $('panel-right').classList.toggle('focused', side === 'right');
}

function getSelectedEntry(side) {
  const entries = side === 'left' ? state.leftEntries : state.rightEntries;
  const idx = side === 'left' ? state.leftSelectedIndex : state.rightSelectedIndex;
  const currentPath = side === 'left' ? state.leftPath : state.rightPath;
  const offset = currentPath ? 1 : 0;
  if (idx === 0 && currentPath) return { isParent: true };
  return entries[idx - offset] || null;
}

function navigateEntry(side, entry) {
  if (!entry) return;
  const currentPath = side === 'left' ? state.leftPath : state.rightPath;

  if (entry.isParent) {
    // Go up
    const parts = currentPath.split('/').filter(Boolean);
    parts.pop();
    loadBrowseData(side, parts.join('/'));
  } else if (entry.isDirectory) {
    loadBrowseData(side, entry.path);
  } else {
    // Open file viewer
    openFileViewer(side, entry.path);
  }
}

function moveSelection(side, delta) {
  const entries = side === 'left' ? state.leftEntries : state.rightEntries;
  const currentPath = side === 'left' ? state.leftPath : state.rightPath;
  const offset = currentPath ? 1 : 0;
  const maxIndex = entries.length + offset - 1;

  if (side === 'left') {
    state.leftSelectedIndex = Math.max(0, Math.min(maxIndex, state.leftSelectedIndex + delta));
  } else {
    state.rightSelectedIndex = Math.max(0, Math.min(maxIndex, state.rightSelectedIndex + delta));
  }
  renderFileList(side);
}

function renderSpaceView() {

const EXT_COLORS = {
  js: '#F7DF1E', ts: '#3178C6', jsx: '#61DAFB', tsx: '#3178C6',
  json: '#A8B9CC', md: '#083FA1', txt: '#AAAAAA',
  py: '#3776AB', rb: '#CC342D', java: '#ED8B00', go: '#00ADD8',
  rs: '#DEA584', c: '#555555', cpp: '#F34B7D', h: '#555555',
  css: '#1572B6', scss: '#CD6799', html: '#E34F26', htm: '#E34F26',
  yml: '#CB171E', yaml: '#CB171E', xml: '#F16529',
  sh: '#89E051', bash: '#89E051',
  png: '#FF6384', jpg: '#FF6384', gif: '#FF6384', svg: '#FFB13B',
  mp3: '#1DB954', wav: '#1DB954', mp4: '#E91E63', avi: '#E91E63',
  zip: '#FFC107', gz: '#FFC107', tar: '#FFC107',
  pdf: '#FF0000', doc: '#2B579A', xls: '#217346',
};

function extColor(ext) {
  return EXT_COLORS[ext] || '#' + ((ext.split('').reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0) & 0xFFFFFF) | 0x404040).toString(16).padStart(6, '0');
}

function renderTreemap(data) {
  const canvas = $('treemap-canvas');
  const container = canvas.parentElement;
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight - 30; // minus header
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#000040';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!data || data.size === 0) {
    ctx.fillStyle = '#00FFFF';
    ctx.font = '14px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('No data', canvas.width / 2, canvas.height / 2);
    return;
  }

  // Navigate to drill path
  let treeNode = data;
  if (state.treemapDrillPath) {
    const parts = state.treemapDrillPath.split('/');
    for (const part of parts) {
      if (treeNode.children) {
        const child = treeNode.children.find(c => c.name === part);
        if (child) treeNode = child;
        else break;
      }
    }
  }

  // Update breadcrumb
  const breadcrumb = state.treemapDrillPath ? `${data.name} / ${state.treemapDrillPath}` : data.name;
  $('treemap-breadcrumb').textContent = breadcrumb;
  $('treemap-info').textContent = humanSize(treeNode.size);

  // Get items to render
  const items = (treeNode.children || []).filter(c => c.size > 0).sort((a, b) => b.size - a.size);
  if (items.length === 0) return;

  // Squarified treemap layout
  state.treemapRects = [];
  squarify(items, { x: 2, y: 2, w: canvas.width - 4, h: canvas.height - 4 }, treeNode.size, ctx);
}

function squarify(items, rect, totalSize, ctx) {
  if (items.length === 0 || rect.w < 2 || rect.h < 2) return;

  if (items.length === 1) {
    drawTreemapRect(ctx, items[0], rect);
    return;
  }

  const sorted = [...items].sort((a, b) => b.size - a.size);
  const isWide = rect.w >= rect.h;

  let row = [];
  let rowSize = 0;
  let remaining = sorted.reduce((s, i) => s + i.size, 0);
  let currentRect = { ...rect };

  for (let i = 0; i < sorted.length; i++) {
    const item = sorted[i];
    const testRow = [...row, item];
    const testSize = rowSize + item.size;

    if (row.length === 0 || worstRatio(testRow, testSize, currentRect, remaining) <= worstRatio(row, rowSize, currentRect, remaining)) {
      row = testRow;
      rowSize = testSize;
    } else {
      // Layout current row
      currentRect = layoutRow(row, rowSize, currentRect, remaining, ctx);
      remaining -= rowSize;
      row = [item];
      rowSize = item.size;
    }
  }

  // Layout last row
  if (row.length > 0) {
    layoutRow(row, rowSize, currentRect, remaining, ctx);
  }
}

function worstRatio(row, rowSize, rect, totalSize) {
  if (row.length === 0 || rowSize === 0) return Infinity;
  const isWide = rect.w >= rect.h;
  const side = isWide ? rect.h : rect.w;
  const otherSide = rowSize / totalSize * (isWide ? rect.w : rect.h);

  let worst = 0;
  for (const item of row) {
    const frac = item.size / rowSize;
    const itemSide = frac * side;
    const ratio = Math.max(otherSide / itemSide, itemSide / otherSide);
    worst = Math.max(worst, ratio);
  }
  return worst;
}

function layoutRow(row, rowSize, rect, totalRemaining, ctx) {
  const isWide = rect.w >= rect.h;
  const rowFrac = rowSize / totalRemaining;

  if (isWide) {
    const rowW = rect.w * rowFrac;
    let y = rect.y;
    for (const item of row) {
      const itemH = (item.size / rowSize) * rect.h;
      drawTreemapRect(ctx, item, { x: rect.x, y, w: rowW, h: itemH });
      y += itemH;
    }
    return { x: rect.x + rowW, y: rect.y, w: rect.w - rowW, h: rect.h };
  } else {
    const rowH = rect.h * rowFrac;
    let x = rect.x;
    for (const item of row) {
      const itemW = (item.size / rowSize) * rect.w;
      drawTreemapRect(ctx, item, { x, y: rect.y, w: itemW, h: rowH });
      x += itemW;
    }
    return { x: rect.x, y: rect.y + rowH, w: rect.w, h: rect.h - rowH };
  }
}

function drawTreemapRect(ctx, item, rect) {
  const ext = item.file ? item.file.extension : '';
  const color = item.children ? '#336' : extColor(ext || 'dir');

  // Save rect for click detection
  state.treemapRects.push({ ...rect, item });

  ctx.fillStyle = color;
  ctx.fillRect(rect.x + 1, rect.y + 1, Math.max(0, rect.w - 2), Math.max(0, rect.h - 2));

  // Border
  ctx.strokeStyle = '#000040';
  ctx.lineWidth = 1;
  ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.w - 1, rect.h - 1);

  // Label
  if (rect.w > 30 && rect.h > 14) {
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `${Math.min(12, rect.h - 4)}px "IBM Plex Mono", monospace`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const label = item.name;
    const maxChars = Math.floor(rect.w / 7);
    const truncated = label.length > maxChars ? label.substring(0, maxChars - 1) + '\u2026' : label;
    ctx.fillText(truncated, rect.x + 3, rect.y + 2);

    if (rect.h > 28 && rect.w > 50) {
      ctx.fillStyle = '#AAAAAA';
      ctx.font = `${Math.min(10, rect.h - 16)}px "IBM Plex Mono", monospace`;
      ctx.fillText(humanSize(item.size), rect.x + 3, rect.y + 16);
    }
  }
}

// Treemap mouse handlers
$('treemap-canvas').addEventListener('click', (e) => {
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  for (let i = state.treemapRects.length - 1; i >= 0; i--) {
    const r = state.treemapRects[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
      if (r.item.children && r.item.children.length > 0) {
        state.treemapDrillPath = state.treemapDrillPath
          ? state.treemapDrillPath + '/' + r.item.name
          : r.item.name;
        renderTreemap(state.spaceLeft.treemapData);
      }
      break;
    }
  }
});

$('treemap-canvas').addEventListener('mousemove', (e) => {
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const tooltip = $('treemap-tooltip');

  for (let i = state.treemapRects.length - 1; i >= 0; i--) {
    const r = state.treemapRects[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (e.clientY - rect.top + 12) + 'px';
      tooltip.textContent = `${r.item.name} — ${humanSize(r.item.size)}`;
      return;
    }
  }
  tooltip.style.display = 'none';
});

$('treemap-canvas').addEventListener('mouseleave', () => {
  $('treemap-tooltip').style.display = 'none';
});

$('treemap-breadcrumb').addEventListener('click', () => {
  if (state.treemapDrillPath) {
    const parts = state.treemapDrillPath.split('/');
    parts.pop();
    state.treemapDrillPath = parts.length > 0 ? parts.join('/') : null;
    renderTreemap(state.spaceLeft.treemapData);
  }
});

// ─── File Viewer ───
async function openFileViewer(side, filePath) {
  try {
    const params = new URLSearchParams({ side, path: filePath });
    const res = await fetch(`/api/file-content?${params}`);
    const data = await res.json();

    state.viewerOpen = true;
    fileViewer.style.display = 'flex';
    $('viewer-title').textContent = `┤ ${filePath} [${side}] ├`;

    if (data.binary) {
      $('viewer-content').innerHTML = `<pre style="color:var(--yellow)">Binary file — cannot display content\n\nFile: ${esc(data.meta.path)}\nSize: ${data.meta.sizeHuman}\nModified: ${data.meta.modified}</pre>`;
    } else if (data.error) {
      $('viewer-content').innerHTML = `<pre style="color:var(--red)">${esc(data.error)}</pre>`;
    } else {
      $('viewer-content').innerHTML = `<pre>${escHtml(data.content)}</pre>`;
    }

    $('viewer-meta').textContent = data.meta ? `${data.meta.sizeHuman} | Modified: ${new Date(data.meta.modified).toLocaleString()} | ${data.meta.permissions}` : '';
  } catch(e) {
    console.error(e);
  }
}

async function openDiffViewer(filePath) {
  try {
    const [leftRes, rightRes] = await Promise.all([
      fetch(`/api/file-content?side=left&path=${encodeURIComponent(filePath)}`),
      fetch(`/api/file-content?side=right&path=${encodeURIComponent(filePath)}`)
    ]);
    const leftData = await leftRes.json();
    const rightData = await rightRes.json();

    state.viewerOpen = true;
    fileViewer.style.display = 'flex';
    $('viewer-title').textContent = `┤ Diff: ${filePath} ├`;

    if (leftData.content && rightData.content) {
      const diff = computeDiff(leftData.content.split('\n'), rightData.content.split('\n'));
      let html = '<div class="diff-container">';
      html += '<div class="diff-pane"><div class="diff-pane-header" style="color:var(--text)">Left</div>';
      for (const line of diff.left) {
        const cls = line.type === 'removed' ? 'removed' : line.type === 'added' ? 'added' : 'unchanged';
        html += `<div class="diff-line ${cls}"><span class="diff-line-num">${line.num || ''}</span>${escHtml(line.text)}</div>`;
      }
      html += '</div><div class="diff-separator"></div>';
      html += '<div class="diff-pane"><div class="diff-pane-header" style="color:var(--text)">Right</div>';
      for (const line of diff.right) {
        const cls = line.type === 'removed' ? 'removed' : line.type === 'added' ? 'added' : 'unchanged';
        html += `<div class="diff-line ${cls}"><span class="diff-line-num">${line.num || ''}</span>${escHtml(line.text)}</div>`;
      }
      html += '</div></div>';
      $('viewer-content').innerHTML = html;
    } else {
      $('viewer-content').innerHTML = '<pre style="color:var(--yellow)">Cannot display diff for binary or unavailable files</pre>';
    }

    $('viewer-meta').textContent = '';
  } catch(e) { console.error(e); }
}

function closeViewer() {
  state.viewerOpen = false;
  fileViewer.style.display = 'none';
}

$('viewer-close').addEventListener('click', closeViewer);

// ─── Simple LCS Diff ───
function computeDiff(linesA, linesB) {
  // Simple line-by-line LCS diff
  const m = linesA.length;
  const n = linesB.length;

  // For very large files, use a simpler approach
  if (m + n > 10000) {
    return simpleDiff(linesA, linesB);
  }

  // Build LCS table
  const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (linesA[i-1] === linesB[j-1]) {
        dp[i][j] = dp[i-1][j-1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
  }

  // Backtrack
  const left = [];
  const right = [];
  let i = m, j = n;
  const actions = [];

  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && linesA[i-1] === linesB[j-1]) {
      actions.unshift({ type: 'same', lineA: i, lineB: j, text: linesA[i-1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      actions.unshift({ type: 'add', lineB: j, text: linesB[j-1] });
      j--;
    } else {
      actions.unshift({ type: 'del', lineA: i, text: linesA[i-1] });
      i--;
    }
  }

  for (const a of actions) {
    if (a.type === 'same') {
      left.push({ num: a.lineA, text: a.text, type: 'unchanged' });
      right.push({ num: a.lineB, text: a.text, type: 'unchanged' });
    } else if (a.type === 'del') {
      left.push({ num: a.lineA, text: a.text, type: 'removed' });
      right.push({ num: '', text: '', type: 'removed' });
    } else {
      left.push({ num: '', text: '', type: 'added' });
      right.push({ num: a.lineB, text: a.text, type: 'added' });
    }
  }

  return { left, right };
}

function simpleDiff(linesA, linesB) {
  // Fallback for large files: just show them side by side
  const maxLen = Math.max(linesA.length, linesB.length);
  const left = [], right = [];
  for (let i = 0; i < maxLen; i++) {
    const a = i < linesA.length ? linesA[i] : '';
    const b = i < linesB.length ? linesB[i] : '';
    const type = a === b ? 'unchanged' : (i >= linesA.length ? 'added' : i >= linesB.length ? 'removed' : 'removed');
    left.push({ num: i < linesA.length ? i + 1 : '', text: a, type: a !== b ? 'removed' : 'unchanged' });
    right.push({ num: i < linesB.length ? i + 1 : '', text: b, type: a !== b ? 'added' : 'unchanged' });
  }
  return { left, right };
}

// ─── Status Bar ───
function updateStatusBar() {
  if (state.scanLeft) {
    $('status-left').textContent = `Left: ${state.scanLeft.totalFiles?.toLocaleString() || '?'} files | ${state.scanLeft.totalSizeHuman || '?'}`;
    $('status-scan').textContent = `Scan: ${((state.scanLeft.scanDuration || 0)/1000).toFixed(1)}s`;
  }
  if (state.scanRight) {
    $('status-right').textContent = `Right: ${state.scanRight.totalFiles?.toLocaleString() || '?'} files | ${state.scanRight.totalSizeHuman || '?'}`;
    const totalDuration = (state.scanLeft?.scanDuration || 0) + (state.scanRight?.scanDuration || 0);
    $('status-scan').textContent = `Scan: ${(totalDuration/1000).toFixed(1)}s`;
  } else if (!state.dualMode) {
    $('status-right').textContent = '';
  }
}

// ─── Click Handlers ───
document.addEventListener('click', (e) => {
  const entry = e.target.closest('.file-entry');
  if (entry) {
    const side = entry.dataset.side;
    const idx = parseInt(entry.dataset.index, 10);
    setFocusedPanel(side);

    if (entry.dataset.action === 'parent') {
      const currentPath = side === 'left' ? state.leftPath : state.rightPath;
      const parts = currentPath.split('/').filter(Boolean);
      parts.pop();
      loadBrowseData(side, parts.join('/'));
      return;
    }

    if (!isNaN(idx)) {
      if (side === 'left') state.leftSelectedIndex = idx;
      else state.rightSelectedIndex = idx;
      renderFileList(side);
    }

    if (e.detail === 2) { // double-click
      const sel = getSelectedEntry(side);
      if (sel) navigateEntry(side, sel);
    }
  }
});

// F-key bar clicks
document.querySelectorAll('.fkey').forEach(el => {
  el.addEventListener('click', () => {
    if (el.classList.contains('disabled')) return;
    handleFKey(el.dataset.key);
  });
});

function handleFKey(key) {
  if (state.viewerOpen && key !== 'F10') { closeViewer(); return; }
  switch(key) {
    case 'F1': showView('browser'); break;
    case 'F3':
      const sel = getSelectedEntry(state.focusedPanel);
      if (sel && !sel.isParent && !sel.isDirectory) {
        openFileViewer(state.focusedPanel, sel.path);
      }
      break;
    case 'F5': showView('compare'); break;
    case 'F6': showView('space'); break;
    case 'F7': showView('dupes'); break;
    case 'F10': showQuitDialog(); break;
  }
}

// ─── Keyboard ───
document.addEventListener('keydown', (e) => {
  // Quit dialog
  if (quitDialog.style.display === 'block') {
    if (e.key === 'y' || e.key === 'Y') { window.close(); return; }
    if (e.key === 'n' || e.key === 'N' || e.key === 'Escape') { quitDialog.style.display = 'none'; return; }
    return;
  }

  // Search bar
  if (state.searchOpen) {
    if (e.key === 'Escape') {
      state.searchOpen = false;
      state.searchQuery = '';
      searchBar.classList.remove('visible');
      renderFileList(state.focusedPanel);
      return;
    }
    if (e.key === 'Enter') {
      state.searchOpen = false;
      searchBar.classList.remove('visible');
      return;
    }
    // Let the input handle it
    return;
  }

  // File viewer
  if (state.viewerOpen) {
    if (e.key === 'Escape' || e.key === 'F3') { closeViewer(); e.preventDefault(); return; }
    return;
  }

  // Global keys
  switch(e.key) {
    case 'F1': e.preventDefault(); handleFKey('F1'); break;
    case 'F3': e.preventDefault(); handleFKey('F3'); break;
    case 'F5': e.preventDefault(); handleFKey('F5'); break;
    case 'F6': e.preventDefault(); handleFKey('F6'); break;
    case 'F7': e.preventDefault(); handleFKey('F7'); break;
    case 'F10': e.preventDefault(); handleFKey('F10'); break;
    case 'q': handleFKey('F10'); break;

    case 'Tab':
      e.preventDefault();
      if (state.dualMode && state.currentView === 'browser') {
        setFocusedPanel(state.focusedPanel === 'left' ? 'right' : 'left');
      }
      break;

    case 'ArrowUp':
      e.preventDefault();
      if (state.currentView === 'browser') moveSelection(state.focusedPanel, -1);
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (state.currentView === 'browser') moveSelection(state.focusedPanel, 1);
      break;
    case 'PageUp':
      e.preventDefault();
      if (state.currentView === 'browser') moveSelection(state.focusedPanel, -20);
      break;
    case 'PageDown':
      e.preventDefault();
      if (state.currentView === 'browser') moveSelection(state.focusedPanel, 20);
      break;
    case 'Home':
      e.preventDefault();
      if (state.currentView === 'browser') {
        if (state.focusedPanel === 'left') state.leftSelectedIndex = 0;
        else state.rightSelectedIndex = 0;
        renderFileList(state.focusedPanel);
      }
      break;
    case 'End':
      e.preventDefault();
      if (state.currentView === 'browser') {
        const entries = state.focusedPanel === 'left' ? state.leftEntries : state.rightEntries;
        const currentPath = state.focusedPanel === 'left' ? state.leftPath : state.rightPath;
        const offset = currentPath ? 1 : 0;
        if (state.focusedPanel === 'left') state.leftSelectedIndex = entries.length + offset - 1;
        else state.rightSelectedIndex = entries.length + offset - 1;
        renderFileList(state.focusedPanel);
      }
      break;

    case 'Enter':
      if (state.currentView === 'browser') {
        const sel = getSelectedEntry(state.focusedPanel);
        if (sel) navigateEntry(state.focusedPanel, sel);
      }
      break;

    case 'Backspace':
      if (state.currentView === 'browser') {
        const currentPath = state.focusedPanel === 'left' ? state.leftPath : state.rightPath;
        if (currentPath) {
          const parts = currentPath.split('/').filter(Boolean);
          parts.pop();
          loadBrowseData(state.focusedPanel, parts.join('/'));
        }
      }
      break;

    case '/':
      if (state.currentView === 'browser') {
        e.preventDefault();
        state.searchOpen = true;
        state.searchQuery = '';
        searchBar.classList.add('visible');
        searchInput.value = '';
        searchInput.focus();
      }
      break;

    case 'Escape':
      if (state.currentView !== 'browser') showView('browser');
      break;
  }
});

searchInput.addEventListener('input', () => {
  state.searchQuery = searchInput.value;
  renderFileList(state.focusedPanel);
});

// ─── Quit Dialog ───
function showQuitDialog() {
  quitDialog.style.display = 'block';
}

$('quit-yes').addEventListener('click', () => window.close());
$('quit-no').addEventListener('click', () => { quitDialog.style.display = 'none'; });

// ─── Resize handler for treemap ───
window.addEventListener('resize', () => {
  if (state.currentView === 'space' && state.spaceLeft) {
    renderTreemap(state.spaceLeft.treemapData);
  }
});

// ─── Utilities ───
function esc(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function humanSize(bytes) {
  if (typeof bytes !== 'number') return bytes;
  if (bytes === 0) return '0 B';
  const sign = bytes < 0 ? '-' : '';
  bytes = Math.abs(bytes);
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return sign + (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

// ─── Start ───
connectWS();
checkStatus();

})();
</script>
